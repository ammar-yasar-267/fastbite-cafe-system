name: Build, test and publish FastBite images

on:
  push:
    branches: [main]        # every merge to main publishes fresh images
  pull_request:             # pull requests only run the tests, they never publish
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  # 1. Prove the whole platform works before anything is published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credentials in the source directory
        run: ./scripts/check-no-secrets.sh

      - name: Start the whole platform (throw-away passwords generated for this run only)
        run: |
          ./scripts/init-env.sh
          docker compose up -d --build --wait

      - name: Run the end-to-end demo (order, payment, failure cases)
        run: ./scripts/demo.sh

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Clean up
        if: always()
        run: docker compose down -v

  # 2. One image per service, built in parallel, pushed to Docker Hub.
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, menu-service, order-service, inventory-service, customer-service, payment-service]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Credentials come ONLY from GitHub Secrets (Settings > Secrets and variables > Actions).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Names and tags that tie every image back to the commit that produced it:
      #   <user>/fastbite-<service>:sha-<7 chars>   short commit id
      #   <user>/fastbite-<service>:<40 chars>      full commit id
      #   <user>/fastbite-<service>:latest          newest main
      # plus labels org.opencontainers.image.revision (full commit) and .source (repo URL).
      - name: Work out image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fastbite-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
